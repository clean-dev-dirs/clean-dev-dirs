# The release pipeline on Forgejo (git.tomplanche.com).
#
# When a push to main changes the version in Cargo.toml (that is, when the tag
# v<version> does not exist yet), this workflow:
#
#   1. creates the tag and the release on Forgejo, with the source archive,
#   2. builds the Linux binary on the Linux runner,
#   3. publishes the crate on crates.io,
#   4. waits for the macOS bottles, then opens a pull request on the Homebrew tap.
#
# Forgejo has no macOS runner. The push mirror copies the tag to GitHub, and
# .github/workflows/macos.yml builds the macOS binaries there. That workflow
# uploads them to this release.
#
# Secrets of the repository:
#   RELEASE_TOKEN  Forgejo access token with write access to the repository
#                  and to the Homebrew tap.
#   CRATES_TOKEN   crates.io API token.
#
# Read docs/maintaining.md for the setup of the secrets and the GitHub part.
name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  API: https://git.tomplanche.com/api/v1
  REPO: clean-dev-dirs/clean-dev-dirs
  TAP_REPO: clean-dev-dirs/homebrew-clean-dev-dirs

jobs:
  version:
    name: Detect a version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the version with the tags
        id: detect
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "Tag v${VERSION} exists: no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v${VERSION} does not exist: release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create the tag and the release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      source_sha256: ${{ steps.source.outputs.sha256 }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install jq
        run: command -v jq > /dev/null || (apt-get update -qq && apt-get install -y -qq jq)

      - name: Create and push the tag
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.git.tomplanche.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create the source archive
        id: source
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="dist/clean-dev-dirs-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="clean-dev-dirs-${VERSION}/" -o "${ARCHIVE}" "v${VERSION}"
          echo "sha256=$(sha256sum "${ARCHIVE}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Create the release
        id: release
        run: |
          set -euo pipefail
          sed "s/{{VERSION}}/${VERSION}/g" .forgejo/release_body.md > release_body.md
          ID=$(jq -n --arg tag "v${VERSION}" --rawfile body release_body.md \
                 '{tag_name: $tag, name: $tag, body: $body}' \
               | curl --silent --show-error --fail --request POST \
                   --header "Authorization: token ${TOKEN}" \
                   --header "Content-Type: application/json" \
                   --data @- "${API}/repos/${REPO}/releases" \
               | jq -r .id)
          echo "Release ID: ${ID}"
          echo "id=${ID}" >> "$GITHUB_OUTPUT"

      - name: Upload the source archive
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: .forgejo/scripts/upload-asset.sh "dist/clean-dev-dirs-${VERSION}.tar.gz"

  build-linux:
    name: Build the Linux binary
    needs: [version, create-release]
    runs-on: ubuntu-latest
    outputs:
      bottle_sha256: ${{ steps.package.outputs.bottle_sha256 }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Create the archive and the bottle
        id: package
        run: |
          set -euo pipefail
          rm -rf dist bottle
          mkdir -p dist "bottle/clean-dev-dirs/${VERSION}/bin"
          tar -czf "dist/clean-dev-dirs-${VERSION}-linux-x86_64.tar.gz" -C target/release clean-dev-dirs
          cp target/release/clean-dev-dirs "bottle/clean-dev-dirs/${VERSION}/bin/"
          BOTTLE="dist/clean-dev-dirs-${VERSION}.x86_64_linux.bottle.tar.gz"
          tar -czf "${BOTTLE}" -C bottle clean-dev-dirs
          echo "bottle_sha256=$(sha256sum "${BOTTLE}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload the assets
        run: for f in dist/*; do .forgejo/scripts/upload-asset.sh "$f"; done

  publish-crate:
    name: Publish on crates.io
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          set -euo pipefail
          # crates.io refuses requests without a User-Agent.
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent "clean-dev-dirs-release-workflow" \
            "https://crates.io/api/v1/crates/clean-dev-dirs/${VERSION}")
          if [ "${STATUS}" = "200" ]; then
            echo "Version ${VERSION} is already on crates.io: skip."
            exit 0
          fi
          cargo publish --locked

  update-tap:
    name: Open a pull request on the Homebrew tap
    needs: [version, create-release, build-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
      SOURCE_SHA256: ${{ needs.create-release.outputs.source_sha256 }}
      LINUX_SHA256: ${{ needs.build-linux.outputs.bottle_sha256 }}
    steps:
      - name: Install jq
        run: command -v jq > /dev/null || (apt-get update -qq && apt-get install -y -qq jq)

      - name: Wait for the macOS bottles from GitHub
        run: |
          set -euo pipefail
          ARM64="clean-dev-dirs-${VERSION}.arm64_sequoia.bottle.tar.gz"
          X86_64="clean-dev-dirs-${VERSION}.sequoia.bottle.tar.gz"
          # Wait 45 minutes at most: the runner stops a job after 1 hour. If the time is over, run this job again
          # when the GitHub workflow is done.
          for attempt in $(seq 1 45); do
            NAMES=$(curl --silent --show-error --fail --header "Authorization: token ${TOKEN}" \
                      "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets" | jq -r '.[].name') || NAMES=""
            if echo "${NAMES}" | grep -qxF "${ARM64}" && echo "${NAMES}" | grep -qxF "${X86_64}"; then
              break
            fi
            if [ "${attempt}" = 45 ]; then
              echo "The macOS bottles are not on the release after 45 minutes."
              exit 1
            fi
            echo "The macOS bottles are not on the release (attempt ${attempt}). Wait 60 seconds."
            sleep 60
          done

          sha() {
            curl --silent --show-error --fail --location --header "Authorization: token ${TOKEN}" \
              "https://git.tomplanche.com/${REPO}/releases/download/v${VERSION}/$1" \
              | sha256sum | cut -d ' ' -f 1
          }
          ARM64_SHA256=$(sha "${ARM64}")
          X86_64_SHA256=$(sha "${X86_64}")
          echo "ARM64_SHA256=${ARM64_SHA256}" >> "$GITHUB_ENV"
          echo "X86_64_SHA256=${X86_64_SHA256}" >> "$GITHUB_ENV"

      - name: Update the formula and push a branch
        run: |
          set -euo pipefail
          BRANCH="bump/clean-dev-dirs-v${VERSION}"
          URL="https://git.tomplanche.com/${REPO}/releases/download/v${VERSION}/clean-dev-dirs-${VERSION}.tar.gz"
          FORMULA="Formula/clean-dev-dirs.rb"

          git clone "https://forgejo-actions:${TOKEN}@git.tomplanche.com/${TAP_REPO}.git" tap
          cd tap
          git switch -c "${BRANCH}"

          sed -i "s|^  url \".*\"|  url \"${URL}\"|" "${FORMULA}"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SOURCE_SHA256}\"|" "${FORMULA}"
          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" "${FORMULA}"
          sed -i "s|assert_match \"clean-dev-dirs [^\"]*\"|assert_match \"clean-dev-dirs ${VERSION}\"|" "${FORMULA}"
          sed -i "/arm64_sequoia:/s/\"[^\"]*\"/\"${ARM64_SHA256}\"/" "${FORMULA}"
          sed -i "/, sequoia:/s/\"[^\"]*\"/\"${X86_64_SHA256}\"/" "${FORMULA}"
          sed -i "/x86_64_linux:/s/\"[^\"]*\"/\"${LINUX_SHA256}\"/" "${FORMULA}"

          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.git.tomplanche.com"
          git commit -am "clean-dev-dirs: bump to v${VERSION}"
          git push origin "${BRANCH}"

      - name: Open the pull request
        run: |
          set -euo pipefail
          jq -n \
            --arg head "bump/clean-dev-dirs-v${VERSION}" \
            --arg title "clean-dev-dirs: bump to v${VERSION}" \
            --arg body "Bump Formula/clean-dev-dirs.rb to v${VERSION}: url, sha256, version, test, and bottle checksums." \
            '{head: $head, base: "main", title: $title, body: $body}' \
          | curl --silent --show-error --fail --request POST \
              --header "Authorization: token ${TOKEN}" \
              --header "Content-Type: application/json" \
              --data @- "${API}/repos/${TAP_REPO}/pulls" \
          | jq -r '"Pull request: \(.html_url)"'
